<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Projects</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">

    <style>
        :root {
            --bg: #1a1b26;
            --panel: #1f2335;
            --panel-hover: #24283b;
            --text: #c0caf5;
            --muted: #9aa5ce;
            --accent: #7aa2f7;
            --cyan: #7dcfff;
            --green: #9ece6a;
            --purple: #bb9af7;
            --border: #3b4261;
            --shadow: rgba(0, 0, 0, 0.32);
            --max-width: 1000px;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: "JetBrains Mono", monospace;
            background:
                linear-gradient(rgba(122, 162, 247, 0.035) 1px, transparent 1px),
                linear-gradient(90deg, rgba(122, 162, 247, 0.035) 1px, transparent 1px),
                var(--bg);
            background-size: 32px 32px;
            color: var(--text);
            min-height: 100vh;
            line-height: 1.6;
        }

        .container {
            max-width: var(--max-width);
            margin: 0 auto;
            padding: 40px 20px 72px;
        }

        .header {
            margin-bottom: 40px;
        }

        .header h1 {
            color: var(--accent);
            font-size: clamp(2rem, 5vw, 3.2rem);
            letter-spacing: -0.055em;
            line-height: 1.1;
            margin-bottom: 12px;
        }

        .header p {
            color: var(--muted);
            max-width: 720px;
        }

        .projects {
            display: flex;
            flex-direction: column;
            gap: 18px;
        }

        .project-card {
            display: block;
            width: 100%;
            background: var(--panel);
            border: 1px solid var(--border);
            border-radius: 10px;
            padding: 22px;
            text-decoration: none;
            color: var(--text);
            box-shadow: 0 10px 30px var(--shadow);
            transition: all 0.2s ease;
        }

        .project-card:hover {
            transform: translateY(-2px);
            background: var(--panel-hover);
            border-color: var(--accent);
        }

        .status {
            font-size: 0.8rem;
            font-weight: 700;
            color: var(--green);
            margin-bottom: 8px;
            text-transform: uppercase;
        }

        .project-card h2 {
            color: var(--purple);
            font-size: 1.4rem;
            margin-bottom: 10px;
        }

        .project-card p {
            color: var(--muted);
            margin-bottom: 14px;
        }

        .tags {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
        }

        .tag {
            font-size: 0.8rem;
            padding: 5px 10px;
            border-radius: 5px;
            border: 1px solid var(--border);
            color: var(--cyan);
        }

        footer {
            margin-top: 40px;
            padding-top: 20px;
            border-top: 1px solid var(--border);
            color: var(--muted);
            font-size: 0.9rem;
        }
    </style>
</head>

<body>
    <main class="container">

        <section class="header">
            <h1>Here is what I am building.</h1>
            <p>
                Project pages documenting work in progress, system design direction,
                and notes from building real things.
            </p>
        </section>

        <section class="projects">

            <!-- Jekyll-generated post link -->
            <a class="project-card" href="{{ '/2026/03/24/jetson-project-1.html' | relative_url }}">
                <h2>Jetson-based posture tracker</h2>

                <div class="tags">
                    <span class="tag">YOLO</span>
                    <span class="tag">Jetson</span>
                    <span class="tag">IMX Camera</span>
                </div>
            </a>

        </section>

        <footer>
            Hosted on GitHub Pages.
        </footer>

    </main>
</body>
</html>
